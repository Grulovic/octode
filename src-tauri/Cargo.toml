[package]
name = "octode"
version = "0.1.0"
description = "A calmer place to build"
authors = ["Octode"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "octode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.32", features = ["bundled"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "multipart", "query", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "json", "uuid"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
russh = "0.63.1"
russh-sftp = "2.1"
base64 = "0.23"
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
rand = "0.10"
